<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Product Management</title>
<style>body{font:17px system-ui;max-width:1000px;margin:40px auto;background:#f5f7fa;color:#18243a}label{display:inline-block;width:140px}input,select{padding:8px;margin:5px;width:260px}button{padding:10px 18px;margin:10px 4px;background:#174ea6;color:white;border:0;border-radius:4px}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}#flash_message{min-height:30px}</style></head>
<body><h1>Product Management</h1>
<div><label for="product_id">ID</label><input id="product_id" readonly></div>
<div><label for="product_name">Name</label><input id="product_name"></div>
<div><label for="product_description">Description</label><input id="product_description"></div>
<div><label for="product_price">Price</label><input id="product_price" type="number" step="0.01" min="0"></div>
<div><label for="product_available">Available</label><select id="product_available"><option value="">Any</option><option value="true">True</option><option value="false">False</option></select></div>
<div><label for="product_category">Category</label><select id="product_category"><option value="">Any</option><option value="UNKNOWN">Unknown</option><option value="CLOTHS">Cloths</option><option value="FOOD">Food</option><option value="HOUSEWARES">Housewares</option><option value="AUTOMOTIVE">Automotive</option><option value="TOOLS">Tools</option></select></div>
<div><button id="create-btn">Create</button><button id="retrieve-btn">Retrieve</button><button id="update-btn">Update</button><button id="delete-btn">Delete</button><button id="clear-btn">Clear</button><button id="search-btn">Search</button></div>
<div id="flash_message" role="status"></div>
<table><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Price</th><th>Available</th><th>Category</th></tr></thead><tbody id="search_results"></tbody></table>
<script>
const fields=['id','name','description','price','available','category'];
const el=n=>document.getElementById('product_'+n);
const flash=document.getElementById('flash_message');
const results=document.getElementById('search_results');
function fill(p){fields.forEach(n=>el(n).value=n==='price'?Number(p[n]).toFixed(2):String(p[n]));}
function clear(){fields.forEach(n=>el(n).value='');results.replaceChildren();flash.textContent='';}
async function run(action){
 flash.textContent='';
 try{
  if(action==='clear'){clear();return;}
  let url='/products', options={};
  if(['retrieve','update','delete'].includes(action)){
   if(!el('id').value){throw Error('Select a product first');}
   url+='/'+el('id').value;
  }
  if(action==='search'){
   const params=new URLSearchParams();
   ['name','available','category'].forEach(n=>{if(el(n).value!=='')params.set(n,el(n).value);});
   url+='?'+params;
  }
  if(action==='create'||action==='update'){
   options={method:action==='create'?'POST':'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:el('name').value,description:el('description').value,price:el('price').value,available:el('available').value==='true',category:el('category').value||'UNKNOWN'})};
  }
  if(action==='delete')options.method='DELETE';
  const response=await fetch(url,options);
  if(!response.ok)throw Error(response.status===404?'Product was not found':'Request failed: '+response.status);
  if(action==='delete'){clear();flash.textContent='Product has been Deleted!';return;}
  const data=await response.json();
  if(action==='search'){
   results.replaceChildren();
   for(const p of data){const row=document.createElement('tr');for(const n of fields){const cell=document.createElement('td');cell.textContent=n==='price'?Number(p[n]).toFixed(2):String(p[n]);row.append(cell);}row.onclick=()=>fill(p);results.append(row);}
   if(data.length)fill(data[0]);
  }else fill(data);
  flash.textContent='Success';
 }catch(error){flash.textContent=error.message;}
}
for(const action of ['create','retrieve','update','delete','clear','search'])document.getElementById(action+'-btn').onclick=()=>run(action);
</script></body></html>
